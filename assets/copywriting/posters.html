<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desain unggahan seblak — contoh kelas</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:#f1ede6;color:#aa321e;font-family:'Plus Jakarta Sans',sans-serif}
.post{width:1080px;height:1080px;position:relative;overflow:hidden;background:#f1ede6}
.post p,.post h1{margin:0}.masthead{position:absolute;top:5.5%;left:6.7%;right:6.7%;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #aa321e;padding-bottom:20px;font-size:23px;font-weight:700}
h1{position:absolute;top:12%;left:6.7%;font-family:'Space Grotesk',sans-serif;font-size:112px;font-weight:700;letter-spacing:-6px;line-height:.98}
.flavour{position:absolute;top:33%;left:6.7%;font-size:26px;font-weight:600;letter-spacing:.3px}
.product{position:absolute;top:38%;left:6.7%;width:86.6%;height:41%;object-fit:cover;object-position:50% 59%;border-radius:24px}
.footer{position:absolute;left:6.7%;right:6.7%;bottom:5.5%;height:132px;display:flex;align-items:center;justify-content:space-between;gap:30px}
.price{display:flex;align-items:baseline;gap:12px;white-space:nowrap}.price strong{font-family:'Space Grotesk',sans-serif;font-size:64px;font-weight:700;letter-spacing:-3px}.price span{font-size:23px;font-weight:600}
.action{background:#aa321e;color:#fff6e9;border-radius:18px;padding:25px 28px;font-size:27px;font-weight:700;line-height:1.35;text-align:center;min-width:350px}
</style>
</head>
<body>
<article class="post" id="informasi" aria-label="Desain informasi produk">
  <div class="masthead"><span>Stan Seblak</span><span>Bazar sekolah</span></div>
  <h1>Seblak<br>kuah hangat.</h1>
  <p class="flavour">Kerupuk, mi, dan ceker.</p>
  <img class="product" src="seblak.webp" width="1200" height="800" alt="Semangkuk seblak dengan kuah merah dan topping lengkap.">
  <div class="footer"><p class="price"><strong>Rp10.000</strong><span>/ porsi</span></p><p class="action">Tersedia<br>di stan kami.</p></div>
</article>
<article class="post" id="promosi" aria-label="Desain promosi dengan copywriting">
  <div class="masthead"><span>Stan Seblak</span><span>Bazar sekolah</span></div>
  <h1>Lapar?<br>Seblak dulu.</h1>
  <p class="flavour">Kuah hangat. Topping lengkap. Istirahat nikmat.</p>
  <img class="product" src="seblak.webp" width="1200" height="800" alt="Foto produk yang sama pada desain promosi seblak.">
  <div class="footer"><p class="price"><strong>Rp10.000</strong><span>/ porsi</span></p><p class="action">Mampir pas<br>istirahat! ↗</p></div>
</article>
</body>
</html>
